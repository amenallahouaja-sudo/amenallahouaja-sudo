<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" width="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080910"/>
      <stop offset="100%" stop-color="#10121f"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
    .blink { animation: bl 1s step-end infinite; }
    .hexPulse1 { animation: hp 2.4s ease-in-out infinite; }
    .hexPulse2 { animation: hp 2.4s ease-in-out 0.8s infinite; }
    .hexPulse3 { animation: hp 2.4s ease-in-out 1.6s infinite; }
    @keyframes bl {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes hp {
      0%, 100% { fill: #00F0FF; opacity: 0.35; }
      50% { fill: #FCEE0A; opacity: 1; }
    }
  </style>

  <!-- Terminal Frame -->
  <polygon points="0,16 16,0 884,0 900,16 900,229 884,245 16,245 0,229" fill="url(#termBg)" stroke="#00F0FF" stroke-width="1.5"/>

  <!-- Header Bar -->
  <polygon points="2,16 16,2 884,2 898,16 898,34 2,34" fill="#131629"/>
  <line x1="2" y1="34" x2="898" y2="34" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="24" cy="18" r="5" fill="#FF003C"/>
  <circle cx="42" cy="18" r="5" fill="#FCEE0A"/>
  <circle cx="60" cy="18" r="5" fill="#00F0FF"/>
  <text x="82" y="22" class="mono" font-size="12" fill="#00F0FF" letter-spacing="1.5">CYBERDECK_OS v2.077 // root@nightcity:~/dossier</text>

  <!-- Left Terminal Dossier -->
  <g transform="translate(28, 62)" class="mono" font-size="13.5">
    <text x="0" y="0" fill="#FCEE0A">root@nightcity<tspan fill="#8892b0">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#8892b0">#</tspan> <tspan fill="#E2E8F0">./inspect --profile vasto</tspan></text>

    <text x="0" y="30" fill="#FF003C">[+]</text>
    <text x="34" y="30" fill="#8892b0">HANDLE     :</text>
    <text x="148" y="30" fill="#FCEE0A" font-weight="bold">Vasto (@amenallahouaja-sudo)</text>

    <text x="0" y="56" fill="#FF003C">[+]</text>
    <text x="34" y="56" fill="#8892b0">CLASS      :</text>
    <text x="148" y="56" fill="#00F0FF">Game Dev // Low-Level &amp; Full-Stack Engineer</text>

    <text x="0" y="82" fill="#FF003C">[+]</text>
    <text x="34" y="82" fill="#8892b0">SPECIALTY  :</text>
    <text x="148" y="82" fill="#E2E8F0">Custom 2D Engines (C/SDL2), Web Apps &amp; Roblox</text>

    <text x="0" y="108" fill="#FF003C">[+]</text>
    <text x="34" y="108" fill="#8892b0">ARSENAL    :</text>
    <text x="148" y="108" fill="#E2E8F0">TS, JS, C/C++, Python, PHP, Lua, SQL, MySQL</text>

    <text x="0" y="134" fill="#FF003C">[+]</text>
    <text x="34" y="134" fill="#8892b0">MISSION    :</text>
    <text x="148" y="134" fill="#FCEE0A">Engineering fast, stylish, high-impact software</text>

    <text x="0" y="164" fill="#00F0FF">&gt; AWAITING NEXT COMMAND_</text>
    <rect x="200" y="152" width="9" height="14" fill="#FCEE0A" class="blink"/>
  </g>

  <!-- Right Panel: Breach Protocol Matrix -->
  <g transform="translate(656, 52)">
    <polygon points="0,8 8,0 216,0 216,166 208,174 0,174" fill="#0c0e1a" stroke="#FCEE0A" stroke-width="1.2"/>
    <rect x="0" y="0" width="216" height="24" fill="#FCEE0A"/>
    <text x="108" y="16" text-anchor="middle" class="mono" font-size="11.5" font-weight="bold" fill="#080910" letter-spacing="1.5">BREACH PROTOCOL</text>

    <g transform="translate(22, 52)" class="mono" font-size="15" font-weight="bold">
      <text x="0" y="0" class="hexPulse1">1C</text>
      <text x="38" y="0" fill="#00F0FF" opacity="0.55">55</text>
      <text x="76" y="0" class="hexPulse2">BD</text>
      <text x="114" y="0" fill="#00F0FF" opacity="0.55">E9</text>
      <text x="152" y="0" fill="#FF003C">7A</text>

      <text x="0" y="30" fill="#00F0FF" opacity="0.55">E9</text>
      <text x="38" y="30" class="hexPulse2">1C</text>
      <text x="76" y="30" fill="#FF003C">55</text>
      <text x="114" y="30" class="hexPulse3">BD</text>
      <text x="152" y="30" fill="#00F0FF" opacity="0.55">1C</text>

      <text x="0" y="60" fill="#FF003C">55</text>
      <text x="38" y="60" fill="#00F0FF" opacity="0.55">7A</text>
      <text x="76" y="60" class="hexPulse1">E9</text>
      <text x="114" y="60" fill="#00F0FF" opacity="0.55">1C</text>
      <text x="152" y="60" class="hexPulse3">BD</text>

      <text x="0" y="90" class="hexPulse3">BD</text>
      <text x="38" y="90" fill="#FF003C">E9</text>
      <text x="76" y="90" fill="#00F0FF" opacity="0.55">7A</text>
      <text x="114" y="90" class="hexPulse1">55</text>
      <text x="152" y="90" class="hexPulse2">1C</text>
    </g>

    <text x="108" y="162" text-anchor="middle" class="mono" font-size="10" fill="#00F0FF" letter-spacing="1">DAEMON: UPLOAD COMPLETE</text>
  </g>
</svg>
